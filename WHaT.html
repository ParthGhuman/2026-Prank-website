<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Future Scanner</title>

<style>
    body {
        background: black;
        color: cyan;
        text-align: center;
        font-family: Arial, sans-serif;
    }

    .hidden { display: none; }

    button {
        background: cyan;
        border: none;
        padding: 15px 30px;
        border-radius: 10px;
        font-size: 18px;
        margin-top: 20px;
        cursor: pointer;
        font-weight: bold;
    }

    iframe {
        width: 90%;
        max-width: 450px;
        height: 253px; /* 16:9 ratio for 450px width */
        display: block;
        margin: 20px auto;
        border-radius: 15px;
        box-shadow: 0 0 25px cyan;
    }

    h2 {
        margin-top: 20px;
        font-size: 26px;
        color: cyan;
    }
</style>

</head>
<body>

<!-- FIRST SCREEN -->
<h1 id="mainText">Want to see your future?<br>Put your hand on the screen for scanning…</h1>

<button id="startBtn">Proceed Further</button>

<!-- HAND SCAN VIDEO -->
<div id="handScan" class="hidden">
  <iframe id="handScanFrame" src="https://www.youtube.com/embed/1unGW4gVcpE?autoplay=1&mute=1" 
          frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
</div>

<!-- TEXT BEFORE FINAL VIDEO -->
<h2 id="readyText" class="hidden">Are you ready?</h2>

<!-- FINAL VIDEO -->
<div id="finalVid" class="hidden">
  <iframe id="finalFrame" src="https://www.youtube.com/embed/GkbPAbKqOro?autoplay=1&mute=1" 
          frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
</div>

<script>
document.getElementById("startBtn").onclick = () => {
    // hide intro
    document.getElementById("mainText").classList.add("hidden");
    document.getElementById("startBtn").classList.add("hidden");

    // show hand scan video
    let handScan = document.getElementById("handScan");
    handScan.classList.remove("hidden");

    // Wait the duration of the hand scan video (approx 5 seconds)
    setTimeout(() => {
        handScan.classList.add("hidden");  

        // Show "Are you ready?"
        let readyText = document.getElementById("readyText");
        readyText.classList.remove("hidden");

        // Wait 2 seconds then show final video
        setTimeout(() => {
            readyText.classList.add("hidden");

            let finalVid = document.getElementById("finalVid");
            finalVid.classList.remove("hidden");
        }, 2000);

    }, 5000); // hand scan duration in ms
};
</script>

</body>
</html>
